# DigitalOcean Functions project: the website's Adopt RISA and Feedback forms,
# stored as anonymous submissions to a KoboToolbox form. No Kobo credentials.
# Deploy with:  doctl serverless deploy contact-form
# Values come from contact-form/.env (not committed; see contact-form/README.md).
packages:
  - name: contact
    functions:
      - name: submit
        runtime: nodejs:18
        web: true
        limits:
          timeout: 15000
          memory: 128
        environment:
          KOBO_SUBMISSION_URL: ${KOBO_SUBMISSION_URL}
          KOBO_ASSET_UID: ${KOBO_ASSET_UID}
          ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
