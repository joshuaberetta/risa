# DigitalOcean App Platform spec for the RISA website (static site).
#
# Applying a spec replaces the whole app spec, so keep this file in step with
# the live one (doctl apps spec get e7104cd6-e15f-4f06-8ce5-afd75e5afd64).
# Apply with:
#   doctl apps update e7104cd6-e15f-4f06-8ce5-afd75e5afd64 --spec .do/app.yaml
#
# Moving from the review site: the old spec served `source_dir: site` with no
# build. That folder is now public/designs/, so this spec must be applied when
# the website-build branch merges to main, or the deploy breaks.
name: risa-website
region: fra
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
features:
  - buildpack-stack=ubuntu-22
domains:
  - domain: risa.kobolabs.dev
    type: PRIMARY
    zone: kobolabs.dev
ingress:
  rules:
    - component:
        name: site
      match:
        path:
          prefix: /
static_sites:
  - name: site
    github:
      repo: joshuaberetta/risa
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    build_command: npm run lint:content && npm run build
    output_dir: dist
    error_document: 404.html
    envs:
      - key: SITE_URL
        value: https://risa.kobolabs.dev
        scope: BUILD_TIME
      # Draft: keep it out of search engines until launch.
      - key: NOINDEX
        value: "true"
        scope: BUILD_TIME
