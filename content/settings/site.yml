# Site-wide settings. The format is in content/README.md.

# The full name, as agreed at the Lyon workshop (Oct 2026). The logo wordmark
# reads it too. Change nameStatus to `agreed` once the working group signs off.
name: Rapid Infrastructures & Services Assessment
nameStatus: pending
shortName: RISA
description: An open method for assessing infrastructure and services in the first days of an emergency, built to be handed over to national authorities.

# Shown on the Adopt and Feedback forms, which open an email to it.
contact: contact@risa-method.org
contactTbc: true

# Where the Adopt RISA and Feedback forms send their answers: the contact-form
# function, which stores them in KoboToolbox (contact-form/README.md). Leave it
# empty and the forms open an email to `contact` instead.
formEndpoint: 'https://faas-fra1-afec6ce7.doserverless.co/api/v1/web/fn-ca8f08f4-450c-4cb8-aaae-9cf4d0f506bf/contact/submit'

# The RISA dashboard (MVP). Who runs it for responses is still to be confirmed.
dashboardUrl: https://risa-dash.kobolabs.dev

partners:
  - id: kobo
    name: Kobo
    role: Data collection
  - id: mapaction
    name: MapAction
    role: GIS and maps
  - id: atlas
    name: Atlas Logistique
    role: Drone imagery

endorsers:
  - id: undac
    name: UNDAC / OCHA
    note: clearance pending
    tbc: true

nav:
  - { label: Method, href: /method }
  - { label: Product, href: /product }
  - { label: Toolbox, href: /toolbox }
  - { label: Data collection, href: /guide }
  - { label: Deployments, href: /deployments }
  - { label: About, href: /about }
cta: { label: Adopt RISA, href: /adopt }

footer:
  owners: RISA is an open method developed by Kobo, MapAction and Atlas Logistique, and built to be handed over to national authorities. Nothing is patented. Use it and adapt it.
  note: "Working draft: the SOP, the name and the endorsement are still pending sign-off. Sample maps use fictional data."
  links:
    - { label: Feedback, href: /feedback }
    - { label: Design review, href: /designs/ }
